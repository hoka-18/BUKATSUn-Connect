<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BUKATSUn Connect - Real-time UX MVP</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0891b2">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* スマホ画面の高さ（アドレスバーを除いたジャストサイズ）に完全にフィットさせる設定 */
    :root {
      --app-height: 100dvh;
    }
    html, body {
      height: var(--app-height);
      overflow: hidden; /* 画面全体の余計なスクロールを禁止 */
    }
    
    .chat-bubble { border-radius: 18px; position: relative; max-width: 75%; }
    .bot-bubble { border-bottom-left-radius: 4px; background-color: #334155; }
    .user-bubble { border-bottom-right-radius: 4px; background-color: #0891b2; color: white; }
    /* 顧問・部長用の吹き出しスタイル */
    .admin-bubble { border-bottom-right-radius: 4px; background-color: #ca8a04; color: white; }
    /* 他のメンバー用の吹き出しスタイル */
    .member-bubble { border-bottom-left-radius: 4px; background-color: #1e293b; color: #f1f5f9; border: 1px solid #334155; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    
    /* チャットスクロールバーの最適化 */
    #chat-timeline::-webkit-scrollbar,
    #leader-chat-timeline::-webkit-scrollbar { width: 4px; }
    #chat-timeline::-webkit-scrollbar-thumb,
    #leader-chat-timeline::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 2px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col h-[100dvh] overflow-hidden select-none">

  <!-- アプリ内カスタムトースト通知コンテナ（画面上部に浮き出てくる） -->
  <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

  <!-- ヘッダーエリア -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-2.5 flex justify-between items-center shadow-md shrink-0">
    <span class="text-lg font-bold text-cyan-400 tracking-wide">BUKATSUn Connect</span>
    
    <div id="menu-tabs" class="hidden flex gap-1.5">
      <button id="tab-main" onclick="clickMainTab()" class="text-[11px] bg-slate-700 px-2.5 py-1.5 rounded-lg font-bold hover:bg-slate-600 transition">集計</button>
      <button id="tab-cal" onclick="switchTab('calendar')" class="text-[11px] bg-slate-700 px-2.5 py-1.5 rounded-lg font-bold hover:bg-slate-600 transition">カレンダー</button>
      <button id="tab-chat" onclick="switchTab('chat')" class="text-[11px] bg-slate-700 px-2.5 py-1.5 rounded-lg font-bold hover:bg-slate-600 transition">チャット</button>
    </div>

    <div id="user-area" class="hidden text-[10px] text-slate-400 flex items-center gap-1.5">
      <span id="user-name" class="text-slate-200 font-bold max-w-[80px] truncate"></span>
      <button id="btn-logout" class="bg-slate-700 px-1.5 py-1 rounded text-[9px] hover:bg-slate-600 transition">解散</button>
    </div>
  </header>

  <!-- メイン表示領域（スマホサイズを最大幅に設定し、スクロールを制御） -->
  <main class="flex-grow overflow-hidden flex flex-col p-3 max-w-lg w-full mx-auto relative">

    <!-- 1. ログイン画面（中央寄せ） -->
    <section id="screen-login" class="bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700 space-y-5 my-auto w-full shrink-0">
      <div class="text-center">
        <div class="w-11 h-11 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-2 border border-cyan-500/20">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <h2 class="text-base font-bold">爆速ログイン</h2>
        <p class="text-[10px] text-slate-400 mt-0.5">リアルタイム同期検証デモ</p>
      </div>

      <div class="space-y-3.5">
        <div class="space-y-1.5">
          <div class="flex justify-between items-center">
            <label class="block text-[9px] font-bold text-emerald-400 uppercase tracking-widest">Member Name</label>
            <span id="member-name-counter" class="text-[9px] text-slate-500 font-semibold">0 / 15文字</span>
          </div>
          <input type="text" id="input-member-name" maxlength="15" placeholder="部員のお名前を入力 (最大15文字)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 transition">
          <button id="login-member" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition">
            部員として開始
          </button>
        </div>
        
        <div class="pt-3.5 border-t border-slate-700/50 space-y-1.5">
          <label class="block text-[9px] font-bold text-cyan-400 uppercase tracking-widest">Admin Access</label>
          <input type="password" id="input-leader-pass" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500 transition">
          <button id="login-leader" class="w-full bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl font-bold text-xs active:scale-95 transition">
            部長・顧問として開始
          </button>
        </div>
      </div>
    </section>

    <!-- 2. 部員画面（出欠回答＆Botサポート・1画面にフルフィット） -->
    <section id="screen-member" class="hidden flex flex-col flex-grow bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden h-full">
      <div class="bg-slate-800 p-2.5 border-b border-slate-700 text-xs font-bold flex items-center gap-1.5 shrink-0">
        <div class="w-6 h-6 rounded-full bg-cyan-600 flex items-center justify-center text-white"><i class="fa-solid fa-robot text-[10px]"></i></div>
        <span>BUKATSUn サポートBot</span>
      </div>

      <!-- チャットのタイムライン（スクロールエリア） -->
      <div id="chat-timeline" class="flex-grow p-3 overflow-y-auto space-y-3 text-xs bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
      </div>

      <!-- 入力＆回答コントローラー（画面下に固定される） -->
      <div class="p-3 bg-slate-800 border-t border-slate-700 space-y-2.5 shrink-0">
        <div class="flex flex-col gap-1">
          <label class="text-[8px] font-bold text-cyan-400 uppercase tracking-widest">対象の活動日を選択：</label>
          <div id="fixed-activity-select-container">
            <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-[11px] text-slate-400" disabled>
              <option>読み込み中...</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-1.5">
          <button onclick="instantUpdate('出席')" class="bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl font-black text-xs active:scale-90 transition">出席</button>
          <button onclick="instantUpdate('欠席')" class="bg-rose-600 hover:bg-rose-500 py-2 rounded-xl font-black text-xs active:scale-90 transition">欠席</button>
          <button onclick="instantUpdate('遅刻')" class="bg-amber-600 hover:bg-amber-500 py-2 rounded-xl font-black text-xs active:scale-90 transition">遅刻</button>
        </div>
        
        <div class="relative">
          <div class="flex gap-1.5">
            <div class="relative flex-grow">
              <input type="text" id="chat-input-comment" maxlength="15" placeholder="理由ややりたいことを送信 (15文字以内)" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-3 pr-14 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
              <span id="chat-comment-counter" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-[8px] text-slate-500 font-semibold bg-slate-950/80 px-1 py-0.5 rounded">0 / 15</span>
            </div>
            <button onclick="sendAdditionalComment()" class="bg-cyan-600 hover:bg-cyan-500 w-10 rounded-xl flex items-center justify-center active:scale-90 transition">
              <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. カレンダー画面（縦スクロールに対応） -->
    <section id="screen-calendar" class="hidden bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-md space-y-3 overflow-y-auto max-h-full">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="font-bold text-xs text-cyan-400"><i class="fa-solid fa-calendar-check mr-1"></i> カレンダー</h3>
        <div class="flex items-center gap-1.5">
          <button onclick="changeMonth(-1)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-[9px] font-bold">◀</button>
          <span class="text-[10px] font-mono text-slate-400" id="calendar-month-year"></span>
          <button onclick="changeMonth(1)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-[9px] font-bold">▶</button>
        </div>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-bold text-slate-500">
        <div class="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-cyan-500">土</div>
      </div>
      <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
      <div id="calendar-detail" class="bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-[10px] hidden animate-in">
        <p class="font-bold text-cyan-400" id="detail-date"></p>
        <p class="mt-0.5 text-slate-200" id="detail-info"></p>
      </div>
    </section>

    <!-- 4. 管理者画面（縦スクロール対応） -->
    <section id="screen-leader" class="hidden space-y-3 overflow-y-auto max-h-full pb-6">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-md space-y-2.5 shrink-0">
        <h3 class="font-bold text-xs text-amber-400"><i class="fa-solid fa-plus-circle mr-1"></i> スケジュール新規登録</h3>
        <div class="grid grid-cols-2 gap-1.5">
          <input type="date" id="schedule-date" class="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-white">
          <input type="text" id="schedule-location" placeholder="場所(例:講堂)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-white">
        </div>
        <button id="btn-add-schedule" class="w-full bg-amber-600 hover:bg-amber-500 py-1.5 rounded-lg font-bold text-xs active:scale-95 transition">登録する</button>
      </div>

      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-md">
        <h3 class="font-bold text-xs text-cyan-400 mb-2 border-b border-slate-700 pb-1.5">リアルタイム出席簿</h3>
        <div id="leader-summary" class="space-y-3"></div>
      </div>
    </section>

    <!-- 5. 全員参加チャット画面（1画面にフルフィット） -->
    <section id="screen-chat" class="hidden flex flex-col flex-grow bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden h-full">
      <div class="bg-slate-800 p-2.5 border-b border-slate-700 text-xs font-bold flex items-center gap-1.5 shrink-0">
        <div class="w-6 h-6 rounded-full bg-amber-600 flex items-center justify-center text-white"><i class="fa-solid fa-comments text-[10px]"></i></div>
        <span>部内連絡チャット</span>
      </div>

      <!-- チャット本文（スクロール領域） -->
      <div id="leader-chat-timeline" class="flex-grow p-3 overflow-y-auto space-y-3 text-xs bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] flex flex-col">
      </div>

      <!-- メッセージ送信フォーム（画面下部に完全固定） -->
      <div class="p-2.5 bg-slate-800 border-t border-slate-700 flex gap-1.5 shrink-0">
        <input type="text" id="leader-chat-input" placeholder="メッセージを入力..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
        <button id="btn-send-leader-message" class="bg-amber-600 hover:bg-amber-500 w-10 rounded-xl flex items-center justify-center active:scale-90 transition text-white shrink-0">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer class="bg-slate-800/40 border-t border-slate-700 py-2 text-center text-[9px] text-slate-500 shrink-0">
    &copy; 2026 B-Team BUKATSUn Connect / MVP UX with Chat Version
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
