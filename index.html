<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUKATSUn Connect - Real-time UX MVP</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0891b2">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .chat-bubble { border-radius: 18px; position: relative; max-width: 75%; }
    .bot-bubble { border-bottom-left-radius: 4px; background-color: #334155; }
    .user-bubble { border-bottom-right-radius: 4px; background-color: #0891b2; color: white; }
    /* 顧問・部長用の吹き出しスタイル */
    .admin-bubble { border-bottom-right-radius: 4px; background-color: #ca8a04; color: white; }
    /* 他のメンバー用の吹き出しスタイル */
    .member-bubble { border-bottom-left-radius: 4px; background-color: #1e293b; color: #f1f5f9; border: 1px solid #334155; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    
    #leader-chat-timeline::-webkit-scrollbar { width: 6px; }
    #leader-chat-timeline::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center shadow-md sticky top-0 z-50">
    <span class="text-xl font-bold text-cyan-400">BUKATSUn Connect</span>
    
    <div id="menu-tabs" class="hidden flex gap-2">
      <button id="tab-main" onclick="clickMainTab()" class="text-xs bg-slate-700 px-3 py-1.5 rounded font-bold hover:bg-slate-600 transition">集計</button>
      <button id="tab-cal" onclick="switchTab('calendar')" class="text-xs bg-slate-700 px-3 py-1.5 rounded font-bold hover:bg-slate-600 transition">カレンダー</button>
      <button id="tab-chat" onclick="switchTab('chat')" class="text-xs bg-slate-700 px-3 py-1.5 rounded font-bold hover:bg-slate-600 transition">チャット</button>
    </div>

    <div id="user-area" class="hidden text-xs text-slate-400 flex items-center gap-2">
      <span id="user-name" class="text-slate-200 font-bold"></span>
      <button id="btn-logout" class="bg-slate-700 px-2 py-1 rounded text-[10px] hover:bg-slate-600 transition">ログアウト</button>
    </div>
  </header>

  <main class="flex-grow p-4 max-w-lg w-full mx-auto flex flex-col justify-start">

    <section id="screen-login" class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-6 my-auto">
      <div class="text-center">
        <div class="w-12 h-12 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-3 border border-cyan-500/20">
          <i class="fa-solid fa-bolt text-xl"></i>
        </div>
        <h2 class="text-lg font-bold">爆速ログイン</h2>
        <p class="text-[11px] text-slate-400 mt-1">リアルタイム同期検証デモ</p>
      </div>

      <div class="space-y-4">
        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-emerald-400 uppercase tracking-widest">Member Name</label>
          <input type="text" id="input-member-name" placeholder="部員のお名前を入力" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
          <button id="login-member" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition">
            部員として開始
          </button>
        </div>
        
        <div class="pt-4 border-t border-slate-700/50 space-y-2">
          <label class="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest">Admin Access</label>
          <input type="password" id="input-leader-pass" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
          <button id="login-leader" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold text-sm active:scale-95 transition">
            部長・顧問として開始
          </button>
        </div>
      </div>
    </section>

    <section id="screen-member" class="hidden flex flex-col flex-grow bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden h-[540px]">
      <div class="bg-slate-800 p-3 border-b border-slate-700 text-sm font-bold flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center text-white"><i class="fa-solid fa-robot text-xs"></i></div>
        <span>BUKATSUn サポートBot</span>
      </div>

      <div id="chat-timeline" class="flex-grow p-4 overflow-y-auto space-y-4 text-sm bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
      </div>

      <div class="p-3 bg-slate-800 border-t border-slate-700 space-y-3">
        <div class="flex flex-col gap-1">
          <label class="text-[9px] font-bold text-cyan-400 uppercase tracking-widest">対象の活動日を選択：</label>
          <div id="fixed-activity-select-container">
            <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-400" disabled>
              <option>読み込み中...</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button onclick="instantUpdate('出席')" class="bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl font-black text-xs active:scale-90 transition">出席</button>
          <button onclick="instantUpdate('欠席')" class="bg-rose-600 hover:bg-rose-500 py-2.5 rounded-xl font-black text-xs active:scale-90 transition">欠席</button>
          <button onclick="instantUpdate('遅刻')" class="bg-amber-600 hover:bg-amber-500 py-2.5 rounded-xl font-black text-xs active:scale-90 transition">遅刻</button>
        </div>
        
        <div class="flex gap-2">
          <input type="text" id="chat-input-comment" placeholder="理由ややりたいことを追加送信..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
          <button onclick="sendAdditionalComment()" class="bg-cyan-600 hover:bg-cyan-500 w-12 rounded-xl flex items-center justify-center active:scale-90 transition">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </section>

    <section id="screen-calendar" class="hidden bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-md space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="font-bold text-sm text-cyan-400"><i class="fa-solid fa-calendar-check mr-1"></i> カレンダー</h3>
        <div class="flex items-center gap-2">
          <button onclick="changeMonth(-1)" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-[10px] font-bold">◀</button>
          <span class="text-xs font-mono text-slate-400" id="calendar-month-year"></span>
          <button onclick="changeMonth(1)" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-[10px] font-bold">▶</button>
        </div>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-500">
        <div class="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-cyan-500">土</div>
      </div>
      <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
      <div id="calendar-detail" class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-xs hidden animate-in">
        <p class="font-bold text-cyan-400" id="detail-date"></p>
        <p class="mt-1 text-slate-200" id="detail-info"></p>
      </div>
    </section>

    <section id="screen-leader" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md space-y-3">
        <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-plus-circle mr-1"></i> スケジュール新規登録</h3>
        <div class="grid grid-cols-2 gap-2">
          <input type="date" id="schedule-date" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white">
          <input type="text" id="schedule-location" placeholder="場所(例:講堂)" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white">
        </div>
        <button id="btn-add-schedule" class="w-full bg-amber-600 hover:bg-amber-500 py-2 rounded-lg font-bold text-xs active:scale-95 transition">登録する</button>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
        <h3 class="font-bold text-sm text-cyan-400 mb-3 border-b border-slate-700 pb-2">リアルタイム出席簿</h3>
        <div id="leader-summary" class="space-y-4"></div>
      </div>
    </section>

    <section id="screen-chat" class="hidden flex flex-col bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden h-[540px] animate-in">
      <div class="bg-slate-800 p-3 border-b border-slate-700 text-sm font-bold flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-amber-600 flex items-center justify-center text-white"><i class="fa-solid fa-comments text-xs"></i></div>
        <span>部内連絡チャット</span>
      </div>

      <div id="leader-chat-timeline" class="flex-grow p-4 overflow-y-auto space-y-4 text-xs bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] flex flex-col">
      </div>

      <div class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
        <input type="text" id="leader-chat-input" placeholder="メッセージを入力..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
        <button id="btn-send-leader-message" class="bg-amber-600 hover:bg-amber-500 w-12 rounded-xl flex items-center justify-center active:scale-90 transition text-white">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </section>

  </main>

  <footer class="bg-slate-800/40 border-t border-slate-700 py-3 mt-8 text-center text-[10px] text-slate-500 sticky bottom-0">
    &copy; 2026 B-Team BUKATSUn Connect / MVP UX with Chat Version
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
